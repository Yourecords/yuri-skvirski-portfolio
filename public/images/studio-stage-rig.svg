<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <rect width="1600" height="900" fill="#0b0d0f"/>
  <circle cx="300" cy="250" r="140" fill="rgba(32,36,42,0.4)"/>
  <circle cx="1200" cy="300" r="180" fill="rgba(199,154,85,0.06)"/>

  <!-- Pedestal Base -->
  <path d="M 800 680 L 700 900 M 800 680 L 900 900 M 800 680 L 800 900" stroke="#15181c" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Fluid Head & Baseplate -->
  <rect x="680" y="580" width="240" height="90" rx="8" fill="#15181c" stroke="#343a42" stroke-width="4"/>
  <!-- 15mm Rails / Rods -->
  <line x1="520" y1="560" x2="1100" y2="560" stroke="#343a42" stroke-width="12" stroke-linecap="round"/>
  <line x1="520" y1="585" x2="1100" y2="585" stroke="#343a42" stroke-width="12" stroke-linecap="round"/>

  <!-- Camera Body -->
  <rect x="680" y="380" width="220" height="170" rx="8" fill="#15181c" stroke="#343a42" stroke-width="4"/>
  <rect x="600" y="400" width="70" height="130" rx="6" fill="#20242a" stroke="#343a42" stroke-width="3"/>
  <rect x="615" y="420" width="40" height="30" rx="2" fill="#0b0d0f"/>

  <!-- Lens & Follow Focus Ring (2% Red Accent) -->
  <rect x="910" y="420" width="130" height="110" rx="6" fill="#20242a" stroke="#343a42" stroke-width="3"/>
  <circle cx="940" cy="530" r="28" fill="#c72732" stroke="#f4f2ed" stroke-width="2"/>
  
  <!-- Matte Box & Teleprompter -->
  <polygon points="1050,370 1220,310 1220,620 1050,560" fill="#15181c" stroke="#343a42" stroke-width="4"/>
  <polygon points="1050,370 1220,310 1280,260 1090,320" fill="#0b0d0f" stroke="#343a42" stroke-width="2"/>
  <polygon points="1220,290 1420,200 1420,700 1220,640" fill="rgba(21, 24, 28, 0.5)" stroke="#343a42" stroke-width="3"/>

  <!-- Top Handle & Operator Monitor -->
  <rect x="730" y="240" width="180" height="110" rx="6" fill="#20242a" stroke="#343a42" stroke-width="3"/>
  <rect x="745" y="255" width="150" height="80" rx="2" fill="#0b0d0f"/>
  <!-- Tally Indicator -->
  <rect x="790" y="228" width="60" height="10" rx="3" fill="#c72732" filter="drop-shadow(0 0 6px #c72732)"/>

  <text x="800" y="860" text-anchor="middle" fill="#a7adb5" font-family="'Manrope', sans-serif" font-size="20" letter-spacing="2">STAGE 03: BROADCAST CAMERA RIGGING, TELEPROMPTER &amp; OPTICAL CALIBRATION</text>
</svg>
