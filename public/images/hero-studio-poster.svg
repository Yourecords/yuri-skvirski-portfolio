<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d0f"/>
      <stop offset="40%" stop-color="#15181c"/>
      <stop offset="80%" stop-color="#20242a"/>
      <stop offset="100%" stop-color="#0b0d0f"/>
    </linearGradient>
    <linearGradient id="light-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(199, 154, 85, 0.22)"/>
      <stop offset="60%" stop-color="rgba(199, 154, 85, 0.04)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15181c"/>
      <stop offset="50%" stop-color="#20242a"/>
      <stop offset="100%" stop-color="#15181c"/>
    </linearGradient>
    <filter id="studio-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background Base (70% Cinematic Black) -->
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>

  <!-- Studio Ceiling Grid & Overhead Lighting Trusses (20% Charcoal & Graphite) -->
  <g stroke="#343a42" stroke-width="3" opacity="0.65">
    <line x1="100" y1="0" x2="200" y2="350"/>
    <line x1="300" y1="0" x2="400" y2="350"/>
    <line x1="600" y1="0" x2="680" y2="350"/>
    <line x1="1200" y1="0" x2="1140" y2="350"/>
    <line x1="1500" y1="0" x2="1420" y2="350"/>
    <line x1="1800" y1="0" x2="1700" y2="350"/>
    <line x1="0" y1="120" x2="1920" y2="120" stroke-dasharray="16 8"/>
    <line x1="0" y1="220" x2="1920" y2="220" stroke-dasharray="24 12"/>
    <line x1="0" y1="320" x2="1920" y2="320"/>
  </g>

  <!-- Studio Lighting Fixtures / Occasional Amber Tungsten Detail -->
  <rect x="520" y="100" width="140" height="40" rx="4" fill="#15181c" stroke="#343a42" stroke-width="2"/>
  <polygon points="520,140 400,600 780,600 660,140" fill="url(#light-beam)"/>
  
  <rect x="1260" y="110" width="160" height="45" rx="4" fill="#15181c" stroke="#343a42" stroke-width="2"/>
  <polygon points="1260,155 1050,650 1500,650 1420,155" fill="url(#light-beam)"/>

  <!-- Background Studio Backdrop Screens -->
  <g filter="url(#studio-blur)">
    <rect x="450" y="320" width="1020" height="420" rx="8" fill="url(#screen-glow)" stroke="#343a42" stroke-width="2"/>
    <path d="M 500 650 Q 800 420 1100 550 T 1400 480" fill="none" stroke="#343a42" stroke-width="5" opacity="0.4"/>
    <circle cx="960" cy="500" r="120" fill="none" stroke="#a7adb5" stroke-width="1.5" opacity="0.2"/>
  </g>

  <!-- Studio Anchor Desk in Midground -->
  <ellipse cx="960" cy="740" rx="480" ry="110" fill="#15181c" stroke="#343a42" stroke-width="4"/>
  <ellipse cx="960" cy="735" rx="460" ry="95" fill="#0b0d0f"/>
  <circle cx="860" cy="520" r="32" fill="#20242a"/>
  <path d="M 800 650 Q 860 560 920 650 Z" fill="#20242a"/>
  <circle cx="1060" cy="530" r="30" fill="#15181c"/>
  <path d="M 1005 650 Q 1060 575 1115 650 Z" fill="#15181c"/>

  <!-- Foreground Cinema Camera Rig (Graphite #15181c & #20242a with fine #343a42 edges) -->
  <g transform="translate(180, 480)">
    <path d="M 160 380 L 120 600 M 180 380 L 220 600 M 150 380 L 70 600" stroke="#15181c" stroke-width="12" stroke-linecap="round"/>
    <circle cx="160" cy="380" r="28" fill="#0b0d0f" stroke="#343a42" stroke-width="4"/>
    
    <rect x="60" y="160" width="220" height="150" rx="8" fill="#15181c" stroke="#343a42" stroke-width="4"/>
    <rect x="90" y="190" width="70" height="45" rx="3" fill="#20242a"/>
    <circle cx="125" cy="212" r="14" fill="#0b0d0f" stroke="#343a42" stroke-width="2"/>
    
    <path d="M 100 160 L 100 110 L 220 110 L 220 160" fill="none" stroke="#20242a" stroke-width="10" stroke-linejoin="round"/>
    <line x1="250" y1="110" x2="250" y2="40" stroke="#343a42" stroke-width="4"/>
    <line x1="270" y1="120" x2="285" y2="50" stroke="#343a42" stroke-width="4"/>
    
    <polygon points="280,180 380,140 380,310 280,270" fill="#20242a" stroke="#343a42" stroke-width="4"/>
    <circle cx="330" cy="225" r="45" fill="#0b0d0f" stroke="#343a42" stroke-width="3"/>
    <!-- 2% Red Accent -->
    <circle cx="330" cy="225" r="32" fill="#0b0d0f" stroke="#c72732" stroke-width="2"/>

    <rect x="180" y="80" width="130" height="85" rx="4" fill="#20242a" stroke="#343a42" stroke-width="3"/>
    <rect x="190" y="90" width="110" height="65" rx="2" fill="#0b0d0f"/>
    <!-- Red Tally on Monitor -->
    <rect x="235" y="72" width="24" height="7" rx="2" fill="#c72732" filter="drop-shadow(0 0 6px #c72732)"/>
  </g>

  <!-- Viewfinder Frame Ticks & Broadcast HUD -->
  <g stroke="#f4f2ed" stroke-width="2" opacity="0.3">
    <path d="M 160 140 L 120 140 L 120 180"/>
    <path d="M 1760 140 L 1800 140 L 1800 180"/>
    <path d="M 160 940 L 120 940 L 120 900"/>
    <path d="M 1760 940 L 1800 940 L 1800 900"/>
  </g>

  <g stroke="#f4f2ed" stroke-width="1.5" opacity="0.35">
    <line x1="940" y1="540" x2="980" y2="540"/>
    <line x1="960" y1="520" x2="960" y2="560"/>
    <circle cx="960" cy="540" r="16" fill="none"/>
  </g>

  <!-- Technical Readout (8% White/Gray Typography & 2% Red Accent) -->
  <text x="140" y="1010" fill="#a7adb5" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="3">4K DCI | 25.00 FPS | ISO 800 | 5600K | LIVE CAM 01</text>
  <text x="1620" y="1010" fill="#c72732" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="22" letter-spacing="3">● REC [PROD]</text>
</svg>
