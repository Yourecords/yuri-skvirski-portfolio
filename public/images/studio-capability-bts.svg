<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <!-- 70% Cinematic Black -->
  <rect width="1200" height="800" fill="#0b0d0f"/>
  
  <!-- Occasional Amber Tungsten Detail in background -->
  <circle cx="200" cy="180" r="160" fill="rgba(199,154,85,0.08)"/>
  
  <!-- Studio background crew (20% Charcoal & Graphite) -->
  <g opacity="0.45">
    <circle cx="900" cy="380" r="30" fill="#20242a"/>
    <rect x="860" y="420" width="80" height="180" fill="#15181c"/>
    <rect x="940" y="340" width="100" height="60" rx="4" fill="#343a42"/>
    <line x1="200" y1="180" x2="200" y2="700" stroke="#343a42" stroke-width="4"/>
  </g>

  <!-- Director Yuri reviewing wireless production monitor -->
  <g transform="translate(320, 220)">
    <circle cx="240" cy="160" r="48" fill="#15181c" stroke="#343a42" stroke-width="2"/>
    <path d="M 120 460 Q 240 230 360 460 Z" fill="#15181c" stroke="#343a42" stroke-width="2"/>
    
    <!-- Cage handles -->
    <rect x="180" y="270" width="12" height="110" rx="3" fill="#343a42"/>
    <rect x="368" y="270" width="12" height="110" rx="3" fill="#343a42"/>
    <!-- Monitor Body -->
    <rect x="190" y="280" width="180" height="115" rx="4" fill="#0b0d0f" stroke="#343a42" stroke-width="3"/>
    <rect x="200" y="290" width="160" height="95" rx="2" fill="#20242a"/>
    <path d="M 210 360 Q 240 330 280 350 T 350 340" fill="none" stroke="#a7adb5" stroke-width="1.5"/>
    <!-- 2% Red Tally Light -->
    <circle cx="280" cy="274" r="4" fill="#c72732" filter="drop-shadow(0 0 4px #c72732)"/>
  </g>

  <rect x="40" y="720" width="1120" height="50" rx="2" fill="rgba(21, 24, 28, 0.9)" stroke="#343a42" stroke-width="1"/>
  <text x="600" y="752" text-anchor="middle" fill="#a7adb5" font-family="'Manrope', sans-serif" font-size="16" letter-spacing="1">STUDIO SUPERVISION — LIVE MULTI-CAMERA DIRECTING &amp; TECHNICAL LEADERSHIP</text>
</svg>
