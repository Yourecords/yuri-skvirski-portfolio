<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="portrait-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d0f"/>
      <stop offset="60%" stop-color="#15181c"/>
      <stop offset="100%" stop-color="#0b0d0f"/>
    </linearGradient>
    <radialGradient id="rim-light" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(199, 154, 85, 0.15)"/>
      <stop offset="50%" stop-color="rgba(199, 154, 85, 0.03)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- 70% Cinematic Black -->
  <rect width="800" height="1000" fill="url(#portrait-grad)"/>
  <rect width="800" height="1000" fill="url(#rim-light)"/>

  <!-- Bokeh circles in background (Charcoal & Subtle Accents) -->
  <circle cx="680" cy="200" r="45" fill="rgba(32,36,42,0.6)"/>
  <circle cx="720" cy="320" r="30" fill="rgba(199,39,50,0.15)"/>
  <circle cx="120" cy="400" r="60" fill="rgba(199,154,85,0.08)"/>
  <rect x="580" y="440" width="160" height="100" rx="4" fill="#15181c" stroke="#343a42" stroke-width="1" opacity="0.4"/>

  <!-- Environmental Portrait Subject Silhouette (Clean dark jacket / overshirt) -->
  <g transform="translate(180, 260)">
    <!-- Soft Directional Key Lighting on Edge of Head -->
    <path d="M 220 120 Q 250 170 230 220" stroke="rgba(199,154,85,0.4)" stroke-width="4" fill="none"/>
    
    <circle cx="220" cy="180" r="95" fill="#15181c" stroke="#343a42" stroke-width="2"/>
    <path d="M 0 580 Q 220 280 440 580 Z" fill="#15181c" stroke="#343a42" stroke-width="2"/>
    <path d="M 180 340 L 220 410 L 260 340" fill="none" stroke="#20242a" stroke-width="3"/>
  </g>

  <!-- Clear Specification Label Overlay (Amber detail) -->
  <g transform="translate(60, 800)">
    <rect x="0" y="0" width="680" height="140" rx="4" fill="rgba(21, 24, 28, 0.95)" stroke="#343a42" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="140" fill="#c79a55"/>
    <text x="28" y="36" fill="#c79a55" font-family="'Manrope', sans-serif" font-size="16" font-weight="bold" letter-spacing="1">PORTRAIT SPECIFICATION PLACEHOLDER</text>
    <text x="28" y="68" fill="#f4f2ed" font-family="'Inter', sans-serif" font-size="14">Environmental portrait in studio/control room environment.</text>
    <text x="28" y="94" fill="#a7adb5" font-family="'Inter', sans-serif" font-size="13">Soft directional key light, recognizable bokeh background.</text>
    <text x="28" y="118" fill="#a7adb5" font-family="'Inter', sans-serif" font-size="13">Wardrobe: dark overshirt or tailored jacket. Calm &amp; approachable.</text>
  </g>
</svg>
